<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13F 数据管理系统</title>
    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0a0a0a',
                        secondary: '#666666'
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="title">13F 数据管理系统</div>
            
            <div class="tabs">
                <a href="/" class="tab-link active">管理</a>
                <a href="/data" class="tab-link">数据展示</a>
                <!-- <a href="#" class="tab-link">自动刷新</a> -->
            </div>
        </div>

        <!-- Download Card -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">下载 13F 数据</div>
                <div class="card-subtitle">选择公司和时间范围以下载 13F 报告数据</div>
            </div>
            
            <form id="downloadForm" class="form-grid">
                <div class="form-group">
                    <label class="form-label">公司名称 (可选)</label>
                    <input type="text" name="company_name" class="form-input" placeholder="例如: Berkshire Hathaway">
                </div>
                
                <div class="form-group">
                    <label class="form-label">CIK 编号</label>
                    <input type="text" name="cik" class="form-input" placeholder="例如: 0001067983">
                </div>
                
                <div class="form-group">
                    <label class="form-label">年份</label>
                    <select name="year" class="form-select">
                        <option value="2025">2025</option>
                        <option value="2024" selected>2024</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">季度</label>
                    <select name="quarter" class="form-select">
                        <option value="Q1">Q1</option>
                        <option value="Q2">Q2</option>
                        <option value="Q3">Q3</option>
                        <option value="Q4">Q4</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <button type="button" onclick="submitDownload()" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        下载数据
                    </button>
                </div>
            </form>
        </div>

        <!-- List Card -->
        <div class="card">
            <div class="card-header flex justify-between items-center" style="display: flex; justify-content: space-between;">
                <div>
                    <div class="card-title">已下载数据</div>
                    <div class="card-subtitle">管理和查看已下载的 13F 报告数据</div>
                </div>
                <button id="btnDelete" onclick="deleteSelected()" class="btn-primary bg-red-500 hidden" style="background-color:#ef4444; color:white;">
                    删除选中项
                </button>
            </div>
            
            <table class="data-table">
                <thead>
                    <tr>
                        <th width="40"><input type="checkbox" id="selectAll" onchange="toggleAll(this)"></th>
                        <th>CIK</th>
                        <th>公司名称</th>
                        <th>年份</th>
                        <th>季度</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="filingsTableBody">
                    <tr><td colspan="7" class="text-center py-8 text-gray-400" style="text-align: center; color:#999;">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- Management Logic ---
        async function loadFilings() {
            try {
                const res = await fetch('/api/filings');
                const filings = await res.json();
                const tbody = document.getElementById('filingsTableBody');
                tbody.innerHTML = '';
                
                if (filings.length === 0) {
                     tbody.innerHTML = '<tr><td colspan="7" class="text-center py-8 text-gray-400" style="text-align:center; padding: 24px;">暂无数据</td></tr>';
                     return;
                }
                
                filings.forEach(f => {
                    const row = `
                        <tr>
                            <td><input type="checkbox" class="row-checkbox" value="${f.id}" onchange="updateDeleteState()"></td>
                            <td class="font-mono text-gray-500">${f.cik}</td>
                            <td class="font-medium">${f.company_name}</td>
                            <td>${f.year}</td>
                            <td>${f.quarter}</td>
                            <td><span class="status-badge status-${f.status.toLowerCase()}">${f.status}</span></td>
                            <td><a href="#" class="text-blue-600">查看</a></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
                updateDeleteState();
            } catch (e) { console.error(e); }
        }

        async function submitDownload() {
            const form = document.getElementById('downloadForm');
            const data = Object.fromEntries(new FormData(form).entries());
            if (!data.cik) { alert('请输入 CIK'); return; }
            if (!data.company_name) data.company_name = "Unknown Company";

            try {
                const res = await fetch('/api/filings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (res.ok) { 
                    loadFilings();
                } else { alert('提交失败'); }
            } catch (e) { alert('系统错误'); }
        }

        // --- Batch Delete ---
        function toggleAll(src) {
            document.querySelectorAll('.row-checkbox').forEach(c => c.checked = src.checked);
            updateDeleteState();
        }
        function updateDeleteState() {
            const count = document.querySelectorAll('.row-checkbox:checked').length;
            const btn = document.getElementById('btnDelete');
            if (count > 0) {
                btn.classList.remove('hidden');
                btn.textContent = `删除选中 (${count})`;
            } else {
                btn.classList.add('hidden');
            }
        }
        async function deleteSelected() {
            const ids = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(c => parseInt(c.value));
            if (!confirm(`确定删除 ${ids.length} 条记录?`)) return;
            
            await fetch('/api/filings/batch-delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ids})
            });
            loadFilings();
        }

        // Init
        loadFilings();
    </script>
</body>
</html>
