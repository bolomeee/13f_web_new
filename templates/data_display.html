<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13F 数据展示</title>
    <link href="/static/css/styles.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0a0a0a',
                        secondary: '#666666',
                        accent: '#3b82f6',
                        'card-bg': '#ffffff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(180deg, #F3F4F6 0%, #EFF6FF 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="p-8 flex justify-center text-slate-800">
    
    <div class="w-full max-w-[1440px] flex flex-col gap-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center bg-white/50 backdrop-blur-sm p-4 rounded-2xl shadow-sm border border-white/50 mb-2">
            <div class="flex items-center gap-3">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-blue-600">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <div class="text-xl font-semibold text-slate-900">13F 数据管理系统</div>
            </div>
            
            <div class="flex bg-slate-100 p-1 rounded-xl">
                <a href="/" class="px-6 py-1.5 rounded-lg text-sm font-medium text-slate-500 hover:text-slate-900 transition-colors">管理</a>
                <a href="/data" class="px-6 py-1.5 rounded-lg text-sm font-medium bg-white text-slate-900 shadow-sm">数据展示</a>
                <!-- <a href="#" class="px-6 py-1.5 rounded-lg text-sm font-medium text-slate-500">自动刷新</a> -->
            </div>
            
            <div class="w-8"></div> <!-- Spacer for balance -->
        </div>

        <div class="flex flex-col lg:flex-row gap-6 items-start">
            
            <!-- Sidebar: Query -->
            <div class="w-full lg:w-[320px] bg-white rounded-2xl p-6 shadow-sm border border-slate-100 shrink-0">
                <div class="mb-6">
                    <h2 class="text-lg font-semibold text-slate-900">查询条件</h2>
                    <p class="text-xs text-slate-500 mt-1">选择公司和季度查看13F数据</p>
                </div>
                
                <div class="flex flex-col gap-5">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-slate-700">选择公司</label>
                        <select id="filter-cik" class="w-full h-11 px-3 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 appearance-none">
                            <option value="">加载中...</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-slate-700">选择季度</label>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="filter-year" class="h-11 px-3 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                                <option value="2025" selected>2025</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                            </select>
                            <select id="filter-quarter" class="h-11 px-3 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                                <option value="Q1">Q1</option>
                                <option value="Q2">Q2</option>
                                <option value="Q3">Q3</option>
                                <option value="Q4" selected>Q4</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="loadComparisonData()" class="w-full h-11 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-lg mt-2 transition-transform active:scale-[0.98]">
                        查询数据
                    </button>
                </div>
            </div>

            <!-- Main Content: Grid -->
            <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                
                <!-- Card 1: Decrease -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col h-[420px]">
                    <div class="flex items-center gap-2 mb-1">
                        <svg class="text-red-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline><polyline points="17 18 23 18 23 12"></polyline></svg>
                        <h3 class="font-medium text-slate-900">持仓减少 Top 10</h3>
                    </div>
                    <p class="text-xs text-slate-400 mb-6">当前季度与上一季度相比持仓股数减少</p>
                    
                    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <div id="list-decreased" class="flex flex-col gap-3">
                            <!-- Items -->
                            <div class="text-center text-gray-400 py-8 text-sm">请查询数据</div>
                        </div>
                    </div>
                </div>

                <!-- Card 2: Increase -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col h-[420px]">
                    <div class="flex items-center gap-2 mb-1">
                        <svg class="text-green-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
                        <h3 class="font-medium text-slate-900">持仓增加 Top 10</h3>
                    </div>
                    <p class="text-xs text-slate-400 mb-6">当前季度与上一季度相比持仓股数增加</p>
                    
                    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <div id="list-increased" class="flex flex-col gap-3">
                            <div class="text-center text-gray-400 py-8 text-sm">请查询数据</div>
                        </div>
                    </div>
                </div>

                <!-- Card 3: Call Options -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col h-[420px]">
                    <div class="flex items-center gap-2 mb-1">
                        <svg class="text-blue-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        <h3 class="font-medium text-slate-900">Call Options Top 10</h3>
                    </div>
                    <p class="text-xs text-slate-400 mb-6">看涨期权持仓总额排名</p>
                    
                    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <div id="list-calls" class="flex flex-col gap-3">
                            <div class="text-center text-gray-400 py-8 text-sm">请查询数据</div>
                        </div>
                    </div>
                </div>

                <!-- Card 4: Put Options -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col h-[420px]">
                    <div class="flex items-center gap-2 mb-1">
                        <svg class="text-purple-500" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="5" x2="5" y2="19"></line><circle cx="6.5" cy="6.5" r="2.5"></circle><circle cx="17.5" cy="17.5" r="2.5"></circle></svg>
                        <h3 class="font-medium text-slate-900">Put Options Top 10</h3>
                    </div>
                    <p class="text-xs text-slate-400 mb-6">看跌期权持仓总额排名</p>
                    
                    <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
                        <div id="list-puts" class="flex flex-col gap-3">
                            <div class="text-center text-gray-400 py-8 text-sm">请查询数据</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        // --- Logic ---
        loadCompanies();
        
        // Mock data or load real data
        async function loadCompanies() {
            try {
                const res = await fetch('/api/data/companies');
                const companies = await res.json();
                const select = document.getElementById('filter-cik');
                select.innerHTML = '<option value="">请选择公司...</option>';
                companies.forEach(c => {
                    select.innerHTML += `<option value="${c.cik}">${c.name}</option>`;
                });
            } catch(e) { console.error(e); }
        }

        async function loadComparisonData() {
            const cik = document.getElementById('filter-cik').value;
            const year = document.getElementById('filter-year').value;
            const quarter = document.getElementById('filter-quarter').value;
            
            if (!cik) { alert("请先选择一家公司"); return; }
            
            // Set loading state
            ['increased', 'decreased', 'calls', 'puts'].forEach(id => {
                document.getElementById(`list-${id}`).innerHTML = '<div class="text-center text-gray-400 py-12">加载中...</div>';
            });
            
            try {
                const res = await fetch(`/api/data/comparison?cik=${cik}&year=${year}&quarter=${quarter}`);
                if (!res.ok) throw new Error("无法获取对比数据");
                const data = await res.json();
                
                renderList('list-decreased', data.analysis.top_decreased, 'change', 'bg-red-500', 'text-red-500');
                renderList('list-increased', data.analysis.top_increased, 'change', 'bg-green-500', 'text-green-500');
                renderList('list-calls', data.analysis.top_calls, 'value', 'bg-blue-500', 'text-blue-500');
                renderList('list-puts', data.analysis.top_puts, 'value', 'bg-purple-500', 'text-purple-500');
                
            } catch(e) {
                alert(e.message);
                ['increased', 'decreased', 'calls', 'puts'].forEach(id => {
                    document.getElementById(`list-${id}`).innerHTML = '<div class="text-center text-red-400 py-12">数据加载失败</div>';
                });
            }
        }

        function renderList(containerId, items, type, bgClass, textClass) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-12 text-sm">无相关数据</div>';
                return;
            }

            items.forEach((item, index) => {
                const rank = index + 1;
                let valueDisplay = '';
                let bgLight = '';
                
                if (type === 'change') {
                    const sign = item.change_pct > 0 ? '+' : '';
                    valueDisplay = `${sign}${item.change_pct.toFixed(2)}%`;
                    // Specific background for decrease/increase panels if needed, generally kept simple white or light gray hover
                    bgLight = bgClass.replace('500', '50');
                } else {
                    // Value formatting
                    valueDisplay = '$' + item.value.toLocaleString();
                    bgLight = bgClass.replace('500', '50');
                }

                // Layout
                const row = `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100/50 hover:border-slate-200 transition-colors">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-6 h-6 rounded-full ${bgClass} text-white flex items-center justify-center text-xs font-bold shrink-0">
                                ${rank}
                            </div>
                            <div class="flex flex-col overflow-hidden">
                                <div class="font-bold text-slate-800 truncate text-sm" title="${item.ticker}">${item.ticker}</div> 
                            </div>
                        </div>
                        <div class="font-mono font-medium ${textClass} text-sm whitespace-nowrap ml-2">
                            ${valueDisplay}
                        </div>
                    </div>
                `;
                container.innerHTML += row;
            });
        }
    </script>
</body>
</html>
